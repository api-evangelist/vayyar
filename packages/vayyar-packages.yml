notes: >-
  Vayyar's developer surface is the Walabot device SDK (Walabot API) for the
  Walabot Maker/Creator/Developer packs, distributed as vendor installers from
  Vayyar's own S3 bucket rather than public package registries. Searches of
  npm, PyPI, Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist, and
  crates.io on 2026-07-21 found no first-party Vayyar/Walabot packages (the
  WalabotAPI Python module ships inside the SDK installers; Vayyar's historical
  pip index at https://api.walabot.com/wlbt/pip/ now returns 403).
