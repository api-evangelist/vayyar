aid: vayyar
name: Vayyar
description: >-
  Vayyar Imaging is an Israeli 4D imaging radar company whose radio-frequency
  sensor-on-chip powers Vayyar Care touchless fall detection for senior
  living, in-cabin automotive sensing for OEMs, and the Walabot product line.
  Developers can program the sensor through the Walabot Maker/Creator packs
  and the Walabot API device SDK — imaging, radar target tracking, breathing
  monitoring, and raw signal data on Windows, Linux, and Raspberry Pi — though
  Vayyar publishes no public web API.
